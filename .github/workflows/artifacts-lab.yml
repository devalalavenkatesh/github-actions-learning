name: Artifacts Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create build output
        run: |
          mkdir dist
          echo "Application built successfully" > dist/app.txt
          ls -R dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: dist/
          retention-days: 1

  verify:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Prove this is a fresh runner
        run: |
          if [ -d dist ]; then
            echo "dist already exists"
          else
            echo "dist does not exist on this new runner"
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: demo-build
          path: downloaded/

      - name: Read downloaded file
        run: |
          ls -R downloaded
          cat downloaded/app.txt
