name: Caching and Artifacts Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: fake-deps
          key: fake-deps-v1

      - name: Simulate a slow install (only runs on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fake-deps
          echo "No cache found, installing from scratch..."
          sleep 5
          echo "some-dependency-data" > fake-deps/lib.txt
          echo "Install complete, this will be cached for next time."

      - name: Show cache status
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "Cache HIT - skipped the slow install step entirely"
          else
            echo "Cache MISS - ran the install step and saved it for next time"
          fi

      - name: Create a build artifact
        run: |
          mkdir -p build-output
          echo "Build finished at $(date -u)" > build-output/report.txt
          echo "Dependency contents:" >> build-output/report.txt
          cat fake-deps/lib.txt >> build-output/report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-output/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: downloaded

      - name: Show downloaded artifact contents
        run: cat downloaded/report.txt
