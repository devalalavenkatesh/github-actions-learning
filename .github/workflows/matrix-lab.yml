name: Matrix Lab

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - Node ${{ matrix.node }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Display configuration
        run: |
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Matrix Node: ${{ matrix.node }}"
          node --version
          npm --version
